version: '3'
services:
  dev-db:
    container_name: doubtfire-dev-db
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: db-root-password
      MYSQL_DATABASE: doubtfire-dev
      MYSQL_USER: dfire
      MYSQL_PASSWORD: pwd
    volumes:
      - ../data/database:/var/lib/mysql

  redis-sidekiq:
    container_name: doubtfire-redis-sidekiq
    image: redis:7.0
    volumes:
      - redis_sidekiq_data:/data

  doubtfire-api:
    container_name: doubtfire-api
    image: lmsdoubtfire/doubtfire-api:8.0-dev
    build: ../doubtfire-api
    ports:
      - "3000:3000"
    volumes:
      - ../doubtfire-api/:/doubtfire
      - ../data/tmp:/doubtfire/tmp
      - ../data/student-work:/student-work
    # Override the image's default CMD to fix two problems with the baked-in command:
    #   1. No DB readiness wait — db:migrate fires before MariaDB is ready on cold start.
    #   2. Roles are not created by migrations on a fresh DB (they were data inserted by
    #      old migrations that are skipped on clean installs), so db:seed ensures they exist.
    # db:seed uses find_or_create_by so it is safe to run on every startup.
    command: >
      /bin/sh -c "
        rm -f tmp/pids/server.pid &&
        until ruby -e 'require %q(socket); TCPSocket.new(%q(doubtfire-dev-db), 3306).close' 2>/dev/null; do
          echo 'Waiting for DB...'; sleep 2;
        done &&
        bundle exec rake db:migrate db:seed &&
        bundle exec rails s -b 0.0.0.0
      "
    depends_on:
      - dev-db
    environment:
      RAILS_ENV: 'development'

      DF_STUDENT_WORK_DIR: /student-work
      DF_INSTITUTION_HOST: http://localhost:4200
      DF_INSTITUTION_PRODUCT_NAME: OnTrack

      DF_SECRET_KEY_BASE: test-secret-key-test-secret-key!
      DF_SECRET_KEY_ATTR: test-secret-key-test-secret-key!
      DF_SECRET_KEY_DEVISE: test-secret-key-test-secret-key!

      # Authentication method - can set to database, ldap, aaf, or saml
      DF_AUTH_METHOD: database

      DF_AAF_ISSUER_URL: https://rapid.test.aaf.edu.au
      DF_AAF_AUDIENCE_URL: http://localhost:3000
      DF_AAF_CALLBACK_URL: http://localhost:3000/api/auth/jwt
      DF_AAF_IDENTITY_PROVIDER_URL: https://signon-uat.deakin.edu.au/idp/shibboleth
      DF_AAF_UNIQUE_URL: https://rapid.test.aaf.edu.au/jwt/authnrequest/research/Ag4EJJhjf0zXHqlKvKZEbg
      DF_AAF_AUTH_SIGNOUT_URL: https://sync-uat.deakin.edu.au/auth/logout
      DF_SECRET_KEY_AAF: v4~LMFLzzwRGZdju\5QBa@FiHIN9

      # Database settings - for development env
      DF_DEV_DB_ADAPTER: mysql2
      DF_DEV_DB_HOST: doubtfire-dev-db
      DF_DEV_DB_DATABASE: doubtfire-dev
      DF_DEV_DB_USERNAME: dfire
      DF_DEV_DB_PASSWORD: pwd

      # Database settings - for test env
      DF_TEST_DB_ADAPTER: mysql2
      DF_TEST_DB_HOST: doubtfire-dev-db
      DF_TEST_DB_DATABASE: doubtfire-dev
      DF_TEST_DB_USERNAME: dfire
      DF_TEST_DB_PASSWORD: pwd

      # Database settings - for test env
      DF_PRODUCTION_DB_ADAPTER: mysql2
      DF_PRODUCTION_DB_HOST: doubtfire-dev-db
      DF_PRODUCTION_DB_DATABASE: doubtfire-dev
      DF_PRODUCTION_DB_USERNAME: dfire
      DF_PRODUCTION_DB_PASSWORD: pwd

      # Overseer - disabled!
      OVERSEER_ENABLED: 0
      # RABBITMQ_HOSTNAME: doubtfire-mq
      # RABBITMQ_USERNAME: secure_credentials
      # RABBITMQ_PASSWORD: secure_credentials

      # Turn It In
      TII_ENABLED: false

      # Redis
      DF_REDIS_SIDEKIQ_URL: redis://doubtfire-redis-sidekiq:6379/0o

      #GoogleOAuth
      GOOGLE_CLIENT_ID: 1091815502751-gklgthqouekrmjo4r9p4kk4bi04o5ols.apps.googleusercontent.com
      DF_KEYCLOAK_URL: http://doubtfire-keycloak:8080   # server-to-server (token exchange, JWKS)
      DF_KEYCLOAK_PUBLIC_URL: http://localhost:8080   # browser-facing (OAuth redirects)
      DF_KEYCLOAK_REALM: doubtfire
      DF_KEYCLOAK_CLIENT_ID: doubtfire-link
      DF_KEYCLOAK_CLIENT_SECRET: PDismW6yAb0Jvqhf7cTxejSYOx1TSAgj
      DF_KEYCLOAK_LINK_CALLBACK: http://localhost:3000/api/auth/link/callback
      DF_KEYCLOAK_SIGNIN_CALLBACK: http://localhost:3000/api/auth/google/callback

  doubtfire-web:
    container_name: doubtfire-web
    image: lmsdoubtfire/doubtfire-web:8.0-dev
    build: ../doubtfire-web
    command: /bin/bash -c 'npm install && npm run build:angular1 && NODE_OPTIONS=--max_old_space_size=4096 npx ng serve --configuration development --proxy-config proxy.conf.docker.json'
    ports:
      - "4200:4200"
    depends_on:
      - doubtfire-api
    volumes:
      - ../doubtfire-web:/doubtfire-web
      - web_node_modules:/doubtfire-web/node_modules

  keycloak:
    container_name: doubtfire-keycloak
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--http-port", "8080", "--hostname-strict=false", "--hostname", "localhost", "--hostname-strict=false"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  web_node_modules:
  redis_sidekiq_data:
  keycloak_data:
